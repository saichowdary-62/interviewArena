[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22.12.0"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@napi-rs/canvas", "pdf-parse", "pdfjs-dist", "vite", "lightningcss", "esbuild", "tsx"]

# Netlify Serverless Functions routing for API endpoints
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA Routing: fallback all client routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

