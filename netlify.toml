[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Netlify Serverless Functions routing for API endpoints
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# SPA Routing: fallback all client routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

